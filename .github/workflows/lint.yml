name: Lint
on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{github.workflow}}-${{github.event.pull_request.number||github.ref}}
    cancel-in-progress: true

jobs:
    format:
        name: Format
        runs-on: ubuntu-24.04
        permissions:
            contents: write # Needed to push

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  token: ${{secrets.TOKEN||github.token}}
                  persist-credentials: true

            - name: Format
              uses: psf/black@35ea67920b7f6ac8e09be1c47278752b1e827f76 # 26.3.0
              with:
                  options: --preview --unstable -C
                  jupyter: true

            - name: Assert clean
              if: startsWith(github.ref_name, 'dependabot/') == true
              run: if [[ `git status --porcelain` ]]; then exit 1; fi

            - name: Commit
              uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
              with:
                  commit_message: Format

    analyze:
        name: Analyze
        runs-on: ubuntu-24.04
        permissions:
            security-events: write # Used by github/codeql-action

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Setup CodeQL
              uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
              with:
                  languages: python
                  queries: security-and-quality

            - name: Analyze
              uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
